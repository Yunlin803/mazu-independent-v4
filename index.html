function prepareSprites(){for(const [key,s]of Object.entries(sprites)){if(!images[s.sheet])continue;const c=document.createElement('canvas');c.width=s.rect[2];c.height=s.rect[3];const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(images[s.sheet],...s.rect,0,0,c.width,c.height);const data=x.getImageData(0,0,c.width,c.height),a=data.data,w=c.width,h=c.height,n=w*h,seen=new Uint8Array(n),queue=new Int32Array(n);let largest=[];for(let start=0;start<n;start++){if(seen[start]||a[start*4+3]<120)continue;let head=0,tail=1;queue[0]=start;seen[start]=1;while(head<tail){const p=queue[head++],col=p%w;const neighbors=[p-w,p+w,col>0?p-1:-1,col<w-1?p+1:-1];for(const q of neighbors)if(q>=0&&q<n&&!seen[q]&&a[q*4+3]>=120){seen[q]=1;queue[tail++]=q}}if(tail>largest.length)largest=queue.slice(0,tail)}const keep=new Uint8Array(n);for(const p of largest)keep[p]=1;for(let p=0;p<n;p++)if(!keep[p])a[p*4+3]=0;x.putImageData(data,0,0);if(key==='collar'){x.clearRect(w/2,0,w/2,h);x.save();x.translate(w,0);x.scale(-1,1);x.drawImage(c,0,0,w/2,h,0,0,w/2,h);x.restore()}pieces[key]=c}}
async function loadAssets(){const results=await Promise.all(Object.entries(sheets).map(([k,v])=>new Promise(resolve=>{const img=new Image();img.onload=()=>{images[k]=img;resolve(true)};img.onerror=()=>{resolve(false)};img.src='./assets/'+v})));ready=results.every(Boolean);if(!ready){const e=document.getElementById('asset-error');e.textContent='部分插畫素材無法載入，請確認以 Python 啟動，且 assets 資料夾完整。';e.style.display='block'}prepareSprites();await Promise.all(Array.from({length:7},(_,j)=>new Promise(resolve=>{const i=j-1,img=new Image();img.onload=()=>{characters[i]=img;resolve()};img.onerror=()=>{ready=false;resolve()};img.src='./assets/characters/'+(i<0?'base':'set'+i)+'.png'})));prepareCharacterFrames();paintAll()}
function drawSprite(ctx,key,destOverride){const s=sprites[key];if(!s||!images[s.sheet])return;if(pieces[key])ctx.drawImage(pieces[key],...(destOverride||s.dest));else ctx.drawImage(images[s.sheet],...s.rect,...(destOverride||s.dest))}
const characters={};
// 固定完整人物作為底圖；每類服飾只在自己的衣冠區域內繪製。
// 原有服裝貼圖僅用於衣櫃圖示，這裡不拼接留白人頭與獨立衣袍。
const characterFrames={};
const FRAME_W=600,FRAME_H=975;
const REGION_PATHS={
 '冠飾':'M100 0H500V96H100Z',
 '髮型':'M122 96H478V190H122Z M300 99C244 99 247 203 300 208C353 203 356 99 300 99Z',
 '上衣':'M300 192L245 224L240 342H360L355 224Z',
 '下裝':'M240 342H360L425 947H175Z',
 '外袍':'M0 195H600V947H0Z M300 192L245 224L240 342L175 947H425L360 342L355 224Z'
};
function makeFrame(img){const c=document.createElement('canvas');c.width=FRAME_W;c.height=FRAME_H;const x=c.getContext('2d');const scale=Math.min(FRAME_W/img.width,FRAME_H/img.height);const w=img.width*scale,h=img.height*scale;x.drawImage(img,(FRAME_W-w)/2,(FRAME_H-h)/2,w,h);return c}
function prepareCharacterFrames(){for(const [id,img] of Object.entries(characters))characterFrames[id]=makeFrame(img)}
function paintRegion(ctx,cat,id){if(id<0||!characterFrames[id])return;const path=new Path2D(REGION_PATHS[cat]);ctx.save();ctx.clip(path,'evenodd');ctx.clearRect(0,0,FRAME_W,FRAME_H);ctx.drawImage(characterFrames[id],0,0);ctx.restore()}
function drawJewelry(ctx,id){if(id<0)return;const palettes=[['#c59a42','#52a99a'],['#d8b050','#7fb5bf'],['#997554','#814c4d'],['#c5a359','#7ea68d'],['#d5aa4c','#ae4038'],['#cbaa5c','#2a9695']];const [gold,stone]=palettes[id];const key=sets[id].acc;ctx.save();ctx.strokeStyle=gold;ctx.fillStyle=gold;ctx.lineWidth=2;ctx.shadowColor='#281c1880';ctx.shadowBlur=2;ctx.shadowOffsetY=1;
 const bead=(x,y,r,color)=>{const g=ctx.createRadialGradient(x-r*.3,y-r*.35,1,x,y,r);g.addColorStop(0,'#fff8db');g.addColorStop(.3,color);g.addColorStop(1,'#6f583c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()};
 if(key==='collar'){ctx.fillStyle='#254b69';ctx.beginPath();ctx.moveTo(300,210);ctx.bezierCurveTo(268,220,241,222,220,240);ctx.bezierCurveTo(227,258,250,259,260,252);ctx.bezierCurveTo(274,277,291,266,300,277);ctx.bezierCurveTo(309,266,326,277,340,252);ctx.bezierCurveTo(350,259,373,258,380,240);ctx.bezierCurveTo(359,222,332,220,300,210);ctx.closePath();ctx.fill();ctx.stroke();for(let k=0;k<9;k++){const xx=240+k*15,yy=250+Math.sin(k/8*Math.PI)*20;bead(xx,yy,2.4,gold)}}else if(key==='jadeBelt'||key==='wineBelt'){ctx.fillStyle=key==='wineBelt'?'#72513e':stone;ctx.beginPath();ctx.moveTo(300,391);ctx.bezierCurveTo(252,364,249,409,293,402);ctx.bezierCurveTo(346,423,349,369,300,391);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(294,400);ctx.lineTo(282,514);ctx.moveTo(306,400);ctx.lineTo(320,494);ctx.stroke();bead(285,474,5,stone);bead(318,456,5,stone);bead(300,394,6,gold)}
 else if(key==='pouch'){ctx.strokeStyle=gold;ctx.beginPath();ctx.moveTo(357,392);ctx.quadraticCurveTo(377,413,382,449);ctx.stroke();ctx.fillStyle=stone;ctx.beginPath();ctx.ellipse(382,467,18,22,0,0,Math.PI*2);ctx.fill();ctx.stroke();bead(382,467,6,gold);ctx.beginPath();ctx.moveTo(382,488);ctx.lineTo(382,523);ctx.stroke()}
 else{for(let row=0;row<2;row++){ctx.beginPath();ctx.moveTo(261,263);ctx.quadraticCurveTo(300,327+row*12,339,263);ctx.stroke();for(let k=0;k<11;k++){const t=k/10,x=261+78*t,y=263+(1-(2*t-1)**2)*(32+row*6);bead(x,y,2.2,gold)}}bead(300,308,8,stone);ctx.beginPath();ctx.moveTo(300,316);ctx.lineTo(300,343);ctx.stroke();bead(300,343,4,stone)}ctx.restore()}
function restoreIdentity(ctx,base){
 // 五官始終來自固定人物；更換髮型不會替換臉孔。
 ctx.save();ctx.beginPath();ctx.ellipse(300,151,43,58,0,0,Math.PI*2);ctx.clip();ctx.drawImage(base,0,0);ctx.restore();
 // 保留人物雙手的原始膚色像素，避免衣袖區域覆蓋手部。
 if(!base._hands){const x=base.getContext('2d');const data=x.getImageData(224,343,152,82);const c=document.createElement('canvas');c.width=152;c.height=82;for(let i=0;i<data.data.length;i+=4){const [r,g,b]=data.data.slice(i,i+3);if(!(r>g*1.035&&g>b*1.02&&r>145&&g>95))data.data[i+3]=0}c.getContext('2d').putImageData(data,0,0);base._hands=c}ctx.drawImage(base._hands,224,343)
}
function drawMazu(canvas,outfit){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const base=characterFrames[-1];if(!base)return;const frame=document.createElement('canvas');frame.width=FRAME_W;frame.height=FRAME_H;const x=frame.getContext('2d');x.drawImage(base,0,0);for(const cat of ['下裝','上衣','外袍','髮型','冠飾'])paintRegion(x,cat,outfit[cat]);drawJewelry(x,outfit['配飾']);restoreIdentity(x,base);ctx.drawImage(frame,0,0,canvas.width,canvas.height)}

function setupVideo(){const v=document.getElementById('story-video');if(!v)return;v.addEventListener('loadedmetadata',()=>{if(filmTime>0)v.currentTime=Math.min(filmTime,v.duration||0)});v.addEventListener('timeupdate',()=>filmTime=v.currentTime);v.addEventListener('error',()=>{if(page==='story')notify('影片載入失敗，請重新輸入展場代碼或確認程式仍在執行。')})}
function paintAll(){document.querySelectorAll('canvas[data-outfit]').forEach(c=>{try{drawMazu(c,JSON.parse(decodeURIComponent(c.dataset.outfit)))}catch{drawMazu(c,empty())}});document.querySelectorAll('canvas[data-item]').forEach(c=>{const key=pieceFor(c.dataset.item,Number(c.dataset.id));const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const s=sprites[key];if(s&&images[s.sheet]){const scale=Math.min((c.width-12)/s.rect[2],(c.height-12)/s.rect[3]);const w=s.rect[2]*scale,h=s.rect[3]*scale;drawSprite(ctx,key,[(c.width-w)/2,(c.height-h)/2,w,h])}else if(!key){ctx.fillStyle='#a29478';ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('無',c.width/2,c.height/2)}})}
setInterval(()=>{if(page==='screen'&&auto&&exhibits().length>1){slide=(slide+1)%exhibits().length;render()}},8000);
let modalFocus=null;
function closeModal(){document.getElementById('overlay').innerHTML='';if(modalFocus?.isConnected)modalFocus.focus()}
function showUnlock(){modalFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="unlock-title"><button class="close" data-action="close" aria-label="關閉">×</button><p class="eyebrow">一段故事，一襲衣冠</p><h2 id="unlock-title">恭喜解鎖新的媽祖衣冠</h2>${costumeFigure(index)}<h2>${sets[index].name}</h2><p class="muted">六個部位的服飾選項已加入收藏，可以自由混搭。</p><div class="actions">${btn('查看文物介紹','unlock-detail')}${btn('繼續探索','unlock-more','secondary')}</div></section></div>`;paintAll();document.querySelector('.modal .close').focus()}
document.addEventListener('submit',e=>{if(e.target.id==='code-form'){e.preventDefault();verifyCode()}});
document.addEventListener('input',e=>{if(e.target.id==='work-name')workName=e.target.value;if(e.target.id==='film-range'){filmTime=Number(e.target.value);paintFilm()}});
document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const bs=[...modal.querySelectorAll('button')],first=bs[0],last=bs[bs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-action]');if(!t||t.disabled)return;if(t.dataset.go){go(t.dataset.go);return}const a=t.dataset.action,id=Number(t.dataset.id);if(['home','stories','collection','dress','creation','works'].includes(a)){go(a);return}
 if(a==='scan'){go('home');notify('已由模擬展場入口進入遊戲');return}if(a==='start'){let n=sets.findIndex((_,i)=>!state.read.includes(i));openStory(n<0?0:n);return}if(a==='story'){openStory(id);return}if(a==='detail'){detail(id);return}
 if(a==='prev-chapter'||a==='next-chapter'){chapter=Math.max(0,Math.min(2,chapter+(a==='next-chapter'?1:-1)));state.reading[index]=chapter;saveState();render();return}
 if(a==='unlock'){if(chapter<2)return;try{const r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:index,token:state.verified[index]||''})});if(!r.ok){delete state.verified[index];saveState();go('gate');notify('請先輸入正確展場代碼。');return}if(state.unlocked.includes(index)){detail(index);return}state.read=[...new Set([...state.read,index])];state.unlocked=[...new Set([...state.unlocked,index])];saveState();showUnlock()}catch{notify('無法讀取內容，請重新整理網頁後再試。')}return}if(a==='close'){closeModal();return}if(a==='unlock-detail'){closeModal();detail(index);return}if(a==='unlock-more'){closeModal();go('stories');return}
 if(a==='favorite'){if(!state.unlocked.includes(index)){openStory(index);notify('請先完成對應故事');return}state.favorites=state.favorites.includes(index)?state.favorites.filter(i=>i!==index):[...state.favorites,index];saveState();render();return}if(a==='wear'){if(!state.unlocked.includes(index)){openStory(index);return}category='外袍';go('dress');return}
 if(a==='category'){category=t.dataset.category;render();return}if(a==='equip'){if(id>=0&&!state.unlocked.includes(id)){notify('閱讀「'+sets[id].story+'」即可解鎖');return}state.outfit={...state.outfit,[category]:id};saveState();render();return}if(a==='reset'){state.outfit=empty();saveState();render();return}
 if(a==='save'){const w=makeWork();state.final=w;state.creations.unshift(w);saveState();notify('作品已儲存，可至「我的作品」查看');return}if(a==='load'){const w=state.creations[id];if(w){state.outfit={...w.outfit};workName=w.name;saveState();go('creation')}return}
 if(a==='submit'){const w=makeWork();state.final=w;state.queue.unshift(w);saveState();slide=0;go('screen');notify('作品已提交至展示佇列');return}
 if(a==='prev-work'||a==='next-work'){slide=(slide+(a==='next-work'?1:-1)+exhibits().length)%exhibits().length;render();return}if(a==='auto'){auto=!auto;render();return}
 if(a==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('此瀏覽器不支援全螢幕')}catch{notify('無法進入全螢幕，請使用瀏覽器全螢幕功能。')}return}
 if(a==='download'||a==='photo'){if(!ready||!characterFrames[-1]){notify('人物仍在載入，請稍後再試');return}const c=document.createElement('canvas');c.width=1200;c.height=1950;drawMazu(c,state.outfit);c.toBlob(blob=>{if(!blob){notify('無法匯出圖片');return}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=(workName.trim()||'媽祖衣冠創作')+'.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)},'image/png')}
});
render();loadAssets();
</script></body></html>
